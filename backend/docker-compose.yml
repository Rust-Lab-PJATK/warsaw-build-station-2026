version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-loco-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: loco
      MONGO_INITDB_ROOT_PASSWORD: loco
      MONGO_INITDB_DATABASE: loco_dev
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local

