[package]
name = "ochain-marketplace"
version = "0.1.0"
description = "Decentralized AI agent task marketplace on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ochain_marketplace"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
