version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: warsaw-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: loco
      MONGO_INITDB_ROOT_PASSWORD: loco
      MONGO_INITDB_DATABASE: loco_dev
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: warsaw-backend
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5150:5150"
    environment:
      LOCO_ENV: development
      ESTIMATE_PROVIDER: ${ESTIMATE_PROVIDER:-elevenlabs}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      ELEVENLABS_SIMULATION_TURNS_LIMIT: ${ELEVENLABS_SIMULATION_TURNS_LIMIT:-8}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MONGODB_URL: mongodb://loco:loco@mongodb:27017/loco_dev?authSource=admin
      MONGODB_DB_NAME: loco_dev

  frontend:
    build:
      context: ./frontend
    container_name: warsaw-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://api.devnet.solana.com}

volumes:
  mongodb_data:
    driver: local
